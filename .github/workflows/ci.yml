name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile application
        run: python -m py_compile app.py journalfit_core.py smoke_test.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Run project smoke test
        run: python smoke_test.py
      - name: Start Streamlit and verify health
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/journalfit-streamlit.log 2>&1 &
          APP_PID=$!
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              kill "$APP_PID"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/journalfit-streamlit.log
          kill "$APP_PID" || true
          exit 1
